<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubShield | Subscription Activated</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 antialiased">
  <div class="max-w-md w-full bg-slate-900/80 border border-slate-800 rounded-3xl p-8 text-center backdrop-blur-md shadow-2xl relative overflow-hidden">
    <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto mb-6 shadow-lg shadow-emerald-500/10">
      <i data-lucide="shield-check" class="w-8 h-8 stroke-[2.5]"></i>
    </div>

    <h1 class="text-2xl font-bold text-white mb-2">Subscription Activated!</h1>
    <p class="text-slate-400 text-sm mb-6">Your payment was confirmed. Your automated subcontractor insurance compliance engine is now live.</p>

    <div class="p-4 rounded-xl bg-slate-950 border border-slate-800/80 text-left mb-6 font-mono text-xs space-y-2">
      <div class="flex justify-between"><span class="text-slate-500">Company:</span><span id="comp-val" class="text-white font-semibold">Miller Construction LLC</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Plan:</span><span id="plan-val" class="text-emerald-400 font-bold">Pro ($399/mo)</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Status:</span><span class="text-emerald-400">Active (Auto-Renewing)</span></div>
    </div>

    <a id="dash-link" href="dashboard.html" class="w-full py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-2">
      <span>Access GC Compliance Dashboard</span>
      <i data-lucide="arrow-right" class="w-4 h-4"></i>
    </a>
  </div>

  <script>
    lucide.createIcons();
    const params = new URLSearchParams(window.location.search);
    const plan = params.get('plan') || 'pro';
    const comp = params.get('company') || 'Miller Construction LLC';
    document.getElementById('comp-val').textContent = decodeURIComponent(comp);
    document.getElementById('plan-val').textContent = plan.toUpperCase() === 'PRO' ? 'Pro ($399/mo)' : 'Starter ($199/mo)';
    document.getElementById('dash-link').href = `dashboard.html?plan=${plan}&company=${encodeURIComponent(comp)}`;
  </script>
</body>
</html>
